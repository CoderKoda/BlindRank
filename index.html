<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Consuming Earth</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="border-strip" id="topBorder"></div>

  <div class="title-slide">
    <div class="title">Consuming Earth</div>
    <div class="credit">Inspired by Neal Agarwal’s Printing Money</div>
    <div class="metric-tabs">
      <button class="tab-btn active" data-metric="energy">⚡ Energy (kWh)</button>
      <button class="tab-btn" data-metric="water">💧 Water (Liters)</button>
      <button class="tab-btn" data-metric="co2">☁️ CO₂ Emissions (kg)</button>
    </div>
  </div>

  <div class="container" id="stripsContainer"></div>

  <div class="border-strip" id="bottomBorder"></div>

  <script src="app.js"></script>
</body>
</html>
